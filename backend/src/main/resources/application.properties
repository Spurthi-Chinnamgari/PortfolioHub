spring.application.name=PortfolioHub Backend

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=${PORT:8080}
